[project]
name = "cassini-backend"
version = "0.1.0"
description = "Location trust and photo-evidence backend for the CASSINI hackathon"
authors = [
    { name = "Vladyslava", email = "vlmhrd@fastmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "pynacl>=1.6.2",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
